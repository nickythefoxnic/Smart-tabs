<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #333;
    }
    h1 { font-size: 20px; margin-bottom: 20px; }
    .mapping-card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
    }
    .mapping-card .group-name { font-weight: 600; font-size: 15px; }
    .mapping-card .project-url { 
      font-size: 12px; color: #666; margin-top: 4px; 
      word-break: break-all;
    }
    .mapping-card .actions { margin-top: 10px; }
    .mapping-card button {
      padding: 6px 12px;
      border: 1px solid #e0e0e0;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .mapping-card button.delete { color: #f44336; }
    .mapping-card button.delete:hover { background: #ffebee; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      vertical-align: middle;
      margin-left: 6px;
    }
    .badge-claude { background: #d97757; color: white; }
    .badge-gpt { background: #10a37f; color: white; }
    .empty { text-align: center; color: #999; padding: 40px; }
    .add-form {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #e0e0e0;
    }
    .add-form input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }
    .add-form button {
      padding: 8px 16px;
      background: #10a37f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Smart Tab Groups - Manage Bindings</h1>

  <div class="add-form">
    <input type="text" id="groupName" placeholder="Tab group name (must match the tab group title exactly)">
    <input type="text" id="projectUrl" placeholder="Project URL (claude.ai/project/... or chatgpt.com/g/g-p-...)">
    <button id="btnAdd">Add Binding</button>
  </div>

  <div id="mappings"></div>

  <script src="options.js"></script>
</body>
</html>
